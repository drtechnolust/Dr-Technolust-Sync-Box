name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;34.0.0'"
      - name: Test and build personal development APK
        run: bash gradlew :app:testDebugUnitTest :tuya-lan:test :app:assembleDebug --console=plain
      # Public release signing stays offline; no publisher keystore in Actions.
