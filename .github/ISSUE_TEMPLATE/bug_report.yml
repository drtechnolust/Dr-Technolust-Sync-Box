name: Bug report
description: Report an app issue without sharing private credentials
body:
  - type: markdown
    attributes:
      value: "Never post local keys, API secrets, full device IDs or unredacted connection screenshots. Only F62 / LAN 3.4 has physical coverage."
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: TV model / Android version / box model and firmware
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
